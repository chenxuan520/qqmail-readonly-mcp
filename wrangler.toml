name = "qqmail-readonly-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyMCP"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "MyMCP"

[[kv_namespaces]]
binding = "EMAIL_KV"
id = "replace-with-your-kv-namespace-id"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "replace-with-your-oauth-kv-namespace-id"

[vars]
ALLOWED_IMAP_HOSTS = "imap.qq.com"
PUBLIC_ORIGIN = "https://your-mcp-host.example.com"

[observability]
enabled = true
