name = "qqmail-readonly-mcp"
main = "src/index.ts"
compatibility_date = "2026-06-14"
compatibility_flags = ["nodejs_compat"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyMCP"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "MyMCP"

[[kv_namespaces]]
binding = "EMAIL_KV"
id = "replace-with-your-kv-namespace-id"

[vars]
TEAM_DOMAIN = "https://your-team.cloudflareaccess.com"
POLICY_AUD = "replace-with-your-access-application-aud-tag"
ALLOWED_IMAP_HOSTS = "imap.qq.com"

[observability]
enabled = true
